  <style>
    /* ── VARIÁVEIS GLOBAIS ── */
    :root {
      --gold:        #c2185b;
      --gold-light:  #ff9ec4;
      --gold-dim:    #8e0e46;
      --rose:        #ffc1dd;
      --dark:        #07050a;
      --dark2:       #100c15;
      --dark3:       #1a1220;
      --cream:       #faf3ef;

      --logo-size:   240px;
      --logo-inner:  202px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: var(--cream);
    }

    /* ── CANVAS PARTÍCULAS ── */
    #particles {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── GRADE SUTIL ── */
    .grid-lines {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
    }
    .grid-lines svg { width: 100%; height: 100%; }

    /* ── GRADIENTE CENTRAL ATMOSFÉRICO ── */
    .atmosphere {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 55% at 50% 50%, rgba(194,24,91,0.04) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(255,193,221,0.03) 0%, transparent 60%);
    }

    /* ── CENA PRINCIPAL ── */
    #scene {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
    }

    /* ── ÁREA DA LOGO ── */
    .logo-wrap {
      display: flex; flex-direction: column; align-items: center;
      animation: logoReveal 2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes logoReveal {
      from { opacity: 0; transform: translateY(24px) scale(0.92); filter: blur(12px); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
    }

    /* ── ANEL EXTERNO — PULSO PURO ── */
    .logo-ring {
      position: relative;
      width:  var(--logo-size);
      height: var(--logo-size);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: ringPulse 4s ease-in-out infinite;
    }

    /* Anel 1 — sólido dourado */
    .logo-ring::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      opacity: 0.7;
      animation: borderPulse 4s ease-in-out infinite;
    }

    /* Anel 2 — halo externo suave */
    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1px solid rgba(194,24,91,0.18);
      animation: haloPulse 4s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.035); }
    }

    @keyframes borderPulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.85; }
    }

    @keyframes haloPulse {
      0%, 100% { inset: -14px; opacity: 0.25; }
      50%       { inset: -22px; opacity: 0.60; }
    }

    /* Terceiro halo — muito suave, raio maior */
    .logo-halo {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 1px dashed rgba(194,24,91,0.08);
      animation: haloPulse2 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes haloPulse2 {
      0%, 100% { inset: -30px; opacity: 0.2; }
      50%       { inset: -42px; opacity: 0.45; }
    }

    /* ── IMAGEM DA LOGO ── */
    .logo-img {
      width:  var(--logo-inner);
      height: var(--logo-inner);
      border-radius: 50%;
      object-fit: cover;
      display: block;
      animation: imgPulse 4s ease-in-out infinite;
    }

    @keyframes imgPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.025); }
    }

    /* Fallback monograma */
    .logo-mono {
      width:  var(--logo-inner);
      height: var(--logo-inner);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--dark3) 0%, #3a0a22 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 64px; font-weight: 300;
      color: var(--gold-light);
      animation: imgPulse 4s ease-in-out infinite;
    }

    /* ── NOME DA MARCA ── */
    .brand {
      margin-top: 32px;
      text-align: center;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(32px, 7vw, 62px);
      letter-spacing: 0.22em;
      color: transparent;
      background: linear-gradient(
        135deg,
        #e0468e 0%,
        #ffb8d9 30%,
        #ff7fb0 60%,
        #a10e52 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 6s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0%   center; }
      50%       { background-position: 100% center; }
    }

    .brand-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(10px, 1.6vw, 13px);
      font-weight: 400;
      letter-spacing: 0.55em;
      color: rgba(194,24,91,0.55);
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── DIVISOR ── */
    .divider {
      display: flex; align-items: center; gap: 16px;
      margin: 30px 0 28px;
      width: clamp(240px, 38vw, 400px);
    }

    .divider-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, rgba(194,24,91,0.35), transparent);
    }

    .divider-gem {
      width: 6px; height: 6px;
      background: var(--gold);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      opacity: 0.7;
    }

    /* ── TAGLINE ── */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(15px, 2.2vw, 20px);
      color: rgba(250,243,239,0.45);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 360px;
      line-height: 1.6;
      animation: fadeUp 2.5s 0.8s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── BOTÃO CTA ── */
    .cta-wrap {
      margin-top: 40px;
      animation: fadeUp 2.5s 1.2s both;
    }

    .cta-btn {
      position: relative;
      display: inline-flex; align-items: center; gap: 14px;
      padding: 0 52px;
      height: 56px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      overflow: hidden;
      outline: none;
      transition: transform 0.3s;
    }

    .cta-btn:hover { transform: translateY(-1px); }

    .cta-btn::before {
      content: '';
      position: absolute; inset: 0;
      border: 1px solid rgba(194,24,91,0.50);
      border-radius: 2px;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .cta-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(194,24,91,0.12), transparent);
      transition: left 0.55s ease;
    }

    .cta-btn:hover::before {
      border-color: rgba(194,24,91,0.85);
      box-shadow: 0 0 24px rgba(194,24,91,0.18), inset 0 0 16px rgba(194,24,91,0.06);
    }

    .cta-btn:hover::after { left: 140%; }

    .cta-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(250,243,239,0.88);
    }

    .cta-arrow {
      display: flex; align-items: center;
      color: var(--gold);
      transition: transform 0.3s;
    }

    .cta-btn:hover .cta-arrow { transform: translateX(5px); }

    /* ── CANTOS DECORATIVOS ── */
    .corner {
      position: fixed;
      width: 52px; height: 52px;
      z-index: 5; opacity: 0.5;
    }
    .corner.tl { top: 28px; left: 28px; }
    .corner.tr { top: 28px; right: 28px; transform: rotate(90deg); }
    .corner.bl { bottom: 28px; left: 28px; transform: rotate(-90deg); }
    .corner.br { bottom: 28px; right: 28px; transform: rotate(180deg); }
    .corner svg { width: 100%; height: 100%; }

    /* ── FAIXA INFERIOR ── */
    .bottom-strip {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent 0%,
        var(--gold-dim) 20%,
        var(--gold) 50%,
        var(--gold-dim) 80%,
        transparent 100%
      );
      opacity: 0.35;
      z-index: 5;
    }

    /* ── FLASH DE TRANSIÇÃO ── */
    #flash {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--dark);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #flash.active { opacity: 1; pointer-events: all; }

    /* ── ACESSIBILIDADE — FOCO VISÍVEL (NAVEGAÇÃO POR TECLADO) ── */
    .cta-btn:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* ── ACESSIBILIDADE — RESPEITA PREFERÊNCIA DE MOVIMENTO REDUZIDO ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── BOTÃO INSTALAR APLICATIVO ── */
    .install-wrap {
      margin-top: 18px;
      animation: fadeUp 2.5s 1.0s both;
    }

    .cta-btn.install-btn {
      padding: 0 38px;
      height: 46px;
    }

    .cta-btn.install-btn::before {
      border-color: rgba(255,193,221,0.32);
    }

    .cta-btn.install-btn:hover::before {
      border-color: rgba(255,193,221,0.75);
      box-shadow: 0 0 20px rgba(255,193,221,0.14), inset 0 0 14px rgba(255,193,221,0.05);
    }

    .cta-btn.install-btn .cta-text {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(250,243,239,0.75);
    }

    .cta-btn.install-btn .cta-arrow {
      color: var(--gold-light);
    }

    /* ── MODAL — INSTRUÇÕES DE INSTALAÇÃO ── */
    .install-modal-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(7,5,10,0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .install-modal {
      position: relative;
      max-width: 380px; width: 100%;
      background: linear-gradient(160deg, var(--dark2) 0%, var(--dark3) 100%);
      border: 1px solid rgba(194,24,91,0.35);
      border-radius: 10px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(194,24,91,0.08);
      animation: fadeUp 0.35s ease both;
    }

    .install-modal h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      margin-bottom: 16px;
    }

    .install-modal p {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14.5px;
      line-height: 1.7;
      color: rgba(250,243,239,0.82);
      margin-bottom: 6px;
    }

    .install-modal ol {
      text-align: left;
      margin: 10px 0 12px;
      padding-left: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14.5px;
      line-height: 1.8;
      color: rgba(250,243,239,0.82);
    }

    .install-modal .modal-icon {
      display: inline-flex;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .install-modal-close {
      margin-top: 20px;
      background: transparent;
      border: 1px solid rgba(194,24,91,0.5);
      color: rgba(250,243,239,0.88);
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 12px 30px;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .install-modal-close:hover {
      border-color: rgba(194,24,91,0.9);
      box-shadow: 0 0 18px rgba(194,24,91,0.18);
    }
    .install-modal-close:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .install-modal { padding: 26px 20px 22px; }
    }

    /* ── RESPONSIVO ── */
    @media (max-width: 480px) {
      :root {
        --logo-size:  190px;

      }

      .corner.bl  { bottom: 16px; left: 16px; }
      .corner.br  { bottom: 16px; right: 16px; }
    }
  </style>

<!-- MODAL — INSTRUÇÕES DE INSTALAÇÃO -->

  <div class="install-modal" role="dialog" aria-modal="true" aria-labelledby="install-modal-title">
    <div class="modal-icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <path d="M12 18h.01"/>
      </svg>
    </div>
    <h2 id="install-modal-title">Instalar Aplicativo</h2>
    <div id="install-modal-body"></div>
    <button type="button" class="install-modal-close" id="install-modal-close">Entendi</button>
  </div>
</div>

<script>
  /* ── INSTALAÇÃO DO APLICATIVO (Android / iOS / PC) ── */
  (function () {
    const installBtn = document.getElementById('install-btn');
    const modal       = document.getElementById('install-modal');
    const modalBody   = document.getElementById('install-modal-body');
    const modalClose  = document.getElementById('install-modal-close');
    let deferredPrompt = null;

    const ua        = window.navigator.userAgent || '';
    const isIOS     = /iphone|ipad|ipod/i.test(ua) ||
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari  = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    function openModal(html) {
      if (!modal || !modalBody) return;
      modalBody.innerHTML = html;
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      if (!modal) return;
      modal.hidden = true;
      document.body.style.overflow = '';
    }

    if (modalClose) modalClose.addEventListener('click', closeModal);
    if (modal) {
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal && !modal.hidden) closeModal();
    });

    function iosInstructions() {
      return '' +
        '<p>Para instalar o app Celia Decorações no seu iPhone/iPad:</p>' +
        '<ol>' +
          '<li>Toque no ícone <strong>Compartilhar</strong> (o quadrado com a seta para cima) na barra do Safari.</li>' +
          '<li>Selecione <strong>“Adicionar à Tela de Início”</strong>.</li>' +
          '<li>Toque em <strong>“Adicionar”</strong> no canto superior direito.</li>' +
        '</ol>' +
        '<p>Pronto! O app aparecerá na sua tela inicial, como um aplicativo normal.</p>';
    }

    function genericInstructions() {
      return '' +
        '<p>Para instalar o app Celia Decorações:</p>' +
        '<ol>' +
          '<li>Toque ou clique no menu do navegador (ícone <strong>⋮</strong> ou <strong>•••</strong>).</li>' +
          '<li>Selecione <strong>“Instalar aplicativo”</strong> ou <strong>“Adicionar à tela inicial”</strong>.</li>' +
          '<li>Confirme a instalação.</li>' +
        '</ol>' +
        '<p>O atalho aparecerá no seu dispositivo ou computador.</p>';
    }

    if (isStandalone()) {
      // Já instalado — não exibe o botão
      if (installBtn) installBtn.hidden = true;
    } else if (installBtn) {
      installBtn.hidden = false;

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          // Android / Chrome / Edge (mobile ou PC) — prompt nativo
          deferredPrompt.prompt();
          try { await deferredPrompt.userChoice; } catch (err) {}
          deferredPrompt = null;
          return;
        }
        if (isIOS && isSafari) {
          openModal(iosInstructions());
        } else {
          openModal(genericInstructions());
        }
      });

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.hidden = false;
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        installBtn.hidden = true;
        closeModal();
      });
    }

    // ── Registro do Service Worker (necessário para instalar no Android/PC) ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  })();

  /* ── PARTÍCULAS FLUTUANTES ── */
  (function () {
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    let W, H;

    const COLORS = [
      'rgba(194,24,91,',
      'rgba(255,158,196,',
      'rgba(255,193,221,',
    ];

    const particles = Array.from({ length: 80 }, () => ({
      x:    Math.random() * 1920,
      y:    Math.random() * 1080,
      r:    Math.random() * 1.4 + 0.2,
      dx:   (Math.random() - 0.5) * 0.18,
      dy:   (Math.random() - 0.5) * 0.18,
      col:  COLORS[Math.floor(Math.random() * COLORS.length)],
      life: Math.random(),
    }));

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const p of particles) {
        p.life += 0.004;
        if (p.life > 1) p.life = 0;
        const alpha = Math.sin(p.life * Math.PI) * 0.55;
        ctx.beginPath();
        ctx.arc(((p.x += p.dx) + W * 10) % W, ((p.y += p.dy) + H * 10) % H, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.col + alpha + ')';
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  })();

  /* ── BOTÃO ENTRAR ── */
  (function () {
    const btn   = document.getElementById('enter-btn');
    const flash = document.getElementById('flash');

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      flash.classList.add('active');
      setTimeout(() => {
        window.location.href = './telainicial.html';
      }, 500);
    });
  })();
</script>
